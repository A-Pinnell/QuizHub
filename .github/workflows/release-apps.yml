name: Publish QuizHub apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm run package:win -- --publish never
            $buildExitCode = $LASTEXITCODE
            if ($buildExitCode -eq 0) {
              exit 0
            }
            if ($attempt -lt 3) {
              Write-Warning "Windows packaging failed on attempt $attempt; retrying after a short delay."
              Start-Sleep -Seconds 10
            }
          }
          exit $buildExitCode

      - name: Save Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: desktop-dist/QuizHub-Setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install AppImage runtime dependency
        run: sudo apt-get update && sudo apt-get install --yes libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run package:linux -- --publish never

      - name: Save Linux app
        uses: actions/upload-artifact@v7
        with:
          name: linux-app
          path: desktop-dist/QuizHub-Linux-x64.AppImage
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npm run android:sync

      - name: Build Android APK
        run: bash ./gradlew assembleDebug
        working-directory: android

      - name: Name Android APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/QuizHub-Android.apk

      - name: Save Android app
        uses: actions/upload-artifact@v7
        with:
          name: android-app
          path: android/app/build/outputs/apk/debug/QuizHub-Android.apk
          if-no-files-found: error

  release:
    needs: [windows, linux, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Download app builds
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach apps to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
