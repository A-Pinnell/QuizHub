<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" href="assets/icon.png">
<title>Quiz Hub - Party Results</title>
<link rel="stylesheet" href="css/party-win.css">
<link rel="stylesheet" href="css/preferences.css">
<link rel="stylesheet" href="css/cover-screen.css">
<script src="./js/audio-focus.js" defer></script>
<script src="./js/load-preferences.js"></script>
<script src="./js/dev-scenes.js" defer></script>
<script src="./js/dev.js" defer></script>
<script src="./js/party-config.js" defer></script>
<script src="./js/party-client.js" defer></script>
<script src="./js/party-question.js" defer></script>
<script src="./js/party-win.js" defer></script>
</head>
<body>
<main class="party-results">
  <header class="party-results-header">
    <span class="party-results-kicker">PARTY MODE</span>
    <h1 id="partyResultsTitle">Final standings</h1>
    <p id="partyResultsSummary"></p>
  </header>
  <nav class="party-results-tabs" id="partyResultsTabs" aria-label="Standings view" hidden>
    <button id="partyCurrentStandings" type="button" aria-pressed="true">CURRENT QUIZ</button>
    <button id="partyOverallStandings" type="button" aria-pressed="false">OVERALL PARTY</button>
  </nav>
  <section class="party-podium" id="partyPodium" aria-label="Player standings"></section>
  <p class="party-results-error" id="partyResultsError" role="status" aria-live="polite" hidden></p>
  <p class="party-results-status" id="partyResultsStatus" role="status" aria-live="polite"></p>
  <footer class="party-results-actions">
    <button id="partyPlayAgain" type="button">PLAY AGAIN</button>
    <button id="partyChooseNewQuiz" type="button">CHOOSE NEW QUIZ</button>
    <a id="partyReturnMenu" href="index.html?fromWin=1">RETURN TO MENU</a>
  </footer>
</main>
</body>
</html>
