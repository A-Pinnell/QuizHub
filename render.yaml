services:
  - type: web
    name: quizhub-party-server
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/nethub/healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: QUIZHUB_REQUIRE_DATABASE
        value: "true"
