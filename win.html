<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quiz Hub - Complete</title>
<link rel="stylesheet" href="css/win.css" >
<script src="./js/win.js" defer></script>
<script src="./js/questionBank.js" defer></script>
</head>
<body>
<button class="sound-toggle" id="soundToggle" type="button" aria-label="Mute sounds" aria-pressed="false">🔊</button>
<div class="stars"></div>
<div class="sun"></div>
<div class="sunset-haze"></div>
<div class="horizon"></div>
<div class="shore"></div>
<canvas id="fireworks"></canvas>

<main class="page">
<section class="card">
  <button class="win-close" id="winClose" type="button" aria-label="Return to main menu">&times;</button>
  <div class="kicker">QUIZ COMPLETE</div>
  <h1 class="title">Great work!</h1>
  <div class="score" id="score">0 / 0</div>
  <p class="summary" id="summary">Loading your results...</p>

  <div class="review-toolbar">
    <div class="review-filters" aria-label="Review question filters">
      <button class="filter-btn active" type="button" data-filter="all">ALL</button>
      <button class="filter-btn" type="button" data-filter="correct">CORRECT</button>
      <button class="filter-btn" type="button" data-filter="incorrect">INCORRECT</button>
    </div>
  </div>

  <section class="review" id="review"></section>

  <div class="error" id="error">
    No quiz results were found. Please return to the menu and start the quiz again.
  </div>

  <div class="actions">
    <button class="btn retry" id="retry" type="button">RETRY</button>
    <button class="btn secondary" id="retakeIncorrect" type="button">RETAKE MISSED</button>
    <button class="btn menu" id="menu" type="button">QUIT TO MENU</button>
  </div>
</section>
</main>
</body>
</html>
