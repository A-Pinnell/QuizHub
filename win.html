<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quiz Hub - Complete</title>
<script src="./js/questionBank.js" defer></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#111}
.sound-toggle{position:fixed;top:14px;left:14px;z-index:20;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.86);color:#111;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.22)}
.sound-toggle:hover{background:#fff;transform:scale(1.06)}
.win-close{position:absolute;top:14px;right:14px;z-index:6;width:46px;height:46px;border:0;border-radius:50%;background:rgba(17,17,17,.12);color:#111;font-size:32px;line-height:1;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.16)}
.win-close:hover{background:rgba(17,17,17,.2);transform:scale(1.06)}
@media(max-width:600px){.sound-toggle{top:auto;left:auto;right:14px;bottom:14px}}
body{
  min-height:100vh;
  overflow:auto;
  background:
    linear-gradient(to bottom,
      #241437 0%,
      #54204b 20%,
      #a53f55 43%,
      #ee7d58 65%,
      #f6b76b 78%,
      #192e42 78%,
      #0b1c2d 100%);
  position:relative;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 66%,rgba(255,225,157,.95) 0 6%,rgba(255,154,87,.22) 17%,transparent 36%),
    linear-gradient(to bottom,transparent 0 74%,rgba(3,16,29,.15) 74%);
  z-index:0;
}
body::after{
  content:"";
  position:fixed;
  left:0;right:0;bottom:0;height:23%;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      178deg,
      rgba(255,177,102,.18) 0 2px,
      transparent 2px 9px
    ),
    linear-gradient(to bottom,rgba(9,29,45,.05),rgba(2,13,24,.72));
  opacity:.8;
  z-index:1;
}

/* CSS-only sun */
.sun{
  position:fixed;
  width:clamp(100px,13vw,190px);
  height:clamp(100px,13vw,190px);
  border-radius:50%;
  left:50%;
  top:53%;
  transform:translate(-50%,-50%);
  background:#ffd477;
  box-shadow:
    0 0 30px #ffd477,
    0 0 90px rgba(255,178,94,.8),
    0 0 180px rgba(255,105,72,.45);
  z-index:0;
  animation:sunsetGlow 4s ease-in-out infinite alternate;
}
.sunset-haze{
  position:fixed;
  left:0;right:0;top:45%;height:30%;
  background:linear-gradient(to bottom,transparent,rgba(255,159,98,.2),transparent);
  pointer-events:none;
  z-index:0;
}

/* Water horizon + shoreline silhouettes */
.horizon{
  position:fixed;
  left:0;right:0;bottom:22%;
  height:5px;
  background:rgba(255,191,125,.65);
  box-shadow:0 0 22px rgba(255,184,112,.7);
  z-index:2;
}
.shore{
  position:fixed;
  left:-3%;right:-3%;bottom:21%;
  height:8%;
  background:#142536;
  clip-path:polygon(0 74%,8% 62%,15% 68%,23% 46%,31% 63%,39% 51%,48% 66%,57% 45%,64% 58%,73% 38%,82% 59%,90% 48%,100% 61%,100% 100%,0 100%);
  z-index:2;
}
.stars{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background-image:
    radial-gradient(circle,rgba(255,245,218,.8) 0 1px,transparent 1.5px),
    radial-gradient(circle,rgba(255,230,191,.6) 0 1px,transparent 1.5px);
  background-size:97px 83px,137px 121px;
  background-position:13px 17px,61px 39px;
  opacity:.5;
}

/* Fireworks canvas */
#fireworks{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:3;
}

/* Results card */
.page{
  min-height:100vh;
  padding:clamp(20px,4vw,42px);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:5;
}
.card{
  position:relative;
  width:min(1050px,100%);
  max-height:calc(100vh - 60px);
  overflow:auto;
  background:rgba(247,242,237,.94);
  border-top:9px solid #7a1731;
  box-shadow:0 30px 90px rgba(5,10,20,.5),0 0 50px rgba(255,155,94,.12);
  padding:clamp(28px,5vw,58px);
  backdrop-filter:blur(7px);
  animation:pageIn .8s cubic-bezier(.16,1.1,.3,1) both;
}
.kicker{
  color:#7a1731;font-weight:900;letter-spacing:4px;font-size:13px;
  animation:rise .55s .05s both;
}
.title{
  font-size:clamp(45px,7vw,82px);margin:7px 0 0;line-height:.95;
  animation:rise .6s .12s both;
}
.score{
  font-size:clamp(40px,6vw,66px);font-weight:900;margin-top:20px;
  animation:scoreIn .75s .18s both;
}
.summary{
  font-size:17px;font-weight:700;color:#59636a;margin:5px 0 30px;
  animation:rise .6s .25s both;
}
.review-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.review-filters{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{
  border:1px solid rgba(122,23,49,.3);background:rgba(255,255,255,.8);color:#2d2d2d;
  min-height:42px;padding:0 16px;border-radius:999px;font:inherit;font-weight:900;letter-spacing:.8px;cursor:pointer;transition:all .18s ease;
}
.filter-btn.active{background:#7a1731;color:#fff;border-color:#7a1731;box-shadow:0 10px 20px rgba(122,23,49,.2)}
.filter-btn:hover{transform:translateY(-2px)}
.review{display:grid;gap:11px;margin-bottom:30px}
.item{
  background:rgba(255,255,255,.94);
  border-left:7px solid #c53d3d;
  padding:16px 18px;
  opacity:0;
  animation:itemIn .5s cubic-bezier(.16,1,.3,1) forwards;
}
.item.correct{border-left-color:#35a84d}
.q{font-weight:900;font-size:16px;margin-bottom:8px;line-height:1.35}
.answer{font-size:14px;line-height:1.55;color:#4d565b;overflow-wrap:anywhere}
.answer strong{color:#111}
.status{margin-top:8px;font-size:12px;font-weight:900;letter-spacing:1.5px}
.correct .status{color:#26943d}
.wrong .status{color:#bd3030}
.actions{display:flex;gap:13px;flex-wrap:wrap}
.btn{
  border:0;min-height:54px;padding:0 28px;
  font:inherit;font-weight:900;letter-spacing:1px;
  cursor:pointer;transition:transform .18s,box-shadow .18s;
}
.btn:hover{transform:translateY(-4px);box-shadow:0 10px 25px rgba(0,0,0,.2)}
.btn:disabled{cursor:not-allowed;opacity:.55;transform:none;box-shadow:none}
.retry{background:#7a1731;color:#fff}
.secondary{background:#dfe6eb;color:#111}
.menu{background:#c8ced1;color:#111}
.error{
  display:none;margin-top:20px;padding:18px;background:#fff;
  border-left:7px solid #c53d3d;font-weight:700;
}
.error.show{display:block}

@keyframes pageIn{from{opacity:0;transform:translateY(35px) scale(.96)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes scoreIn{0%{opacity:0;transform:scale(.65)}65%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes itemIn{from{opacity:0;transform:translateX(-25px)}to{opacity:1;transform:none}}
@keyframes sunsetGlow{from{box-shadow:0 0 30px #ffd477,0 0 75px rgba(255,178,94,.7),0 0 150px rgba(255,105,72,.35)}to{box-shadow:0 0 42px #ffd477,0 0 105px rgba(255,178,94,.9),0 0 200px rgba(255,105,72,.5)}}

@media(max-width:600px){
  .page{padding:14px}
  .card{max-height:none;padding:25px 19px}
  .actions .btn{flex:1;min-width:145px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<button class="sound-toggle" id="soundToggle" type="button" aria-label="Mute sounds" aria-pressed="false">🔊</button>
<div class="stars"></div>
<div class="sun"></div>
<div class="sunset-haze"></div>
<div class="horizon"></div>
<div class="shore"></div>
<canvas id="fireworks"></canvas>

<main class="page">
<section class="card">
  <button class="win-close" id="winClose" type="button" aria-label="Return to main menu">&times;</button>
  <div class="kicker">QUIZ COMPLETE</div>
  <h1 class="title">Great work!</h1>
  <div class="score" id="score">0 / 0</div>
  <p class="summary" id="summary">Loading your results...</p>

  <div class="review-toolbar">
    <div class="review-filters" aria-label="Review question filters">
      <button class="filter-btn active" type="button" data-filter="all">ALL</button>
      <button class="filter-btn" type="button" data-filter="correct">CORRECT</button>
      <button class="filter-btn" type="button" data-filter="incorrect">INCORRECT</button>
    </div>
  </div>

  <section class="review" id="review"></section>

  <div class="error" id="error">
    No quiz results were found. Please return to the menu and start the quiz again.
  </div>

  <div class="actions">
    <button class="btn retry" id="retry" type="button">RETRY</button>
    <button class="btn secondary" id="retakeIncorrect" type="button">RETAKE MISSED</button>
    <button class="btn menu" id="menu" type="button">QUIT TO MENU</button>
  </div>
</section>
</main>

<script>
window.addEventListener("load", function(){
  "use strict";

  let soundsMuted=localStorage.getItem("quizHubMuted")==="true";
  const winSound=new Audio("sfx/Win.wav");
  if(!soundsMuted) winSound.play().catch(()=>{});

  const soundToggle=document.getElementById("soundToggle");
  function updateSoundToggle(){
    soundToggle.textContent=soundsMuted?"🔇":"🔊";
    soundToggle.setAttribute("aria-label",soundsMuted?"Unmute sounds":"Mute sounds");
    soundToggle.setAttribute("aria-pressed",String(soundsMuted));
  }
  soundToggle.addEventListener("click",function(){
    soundsMuted=!soundsMuted;
    localStorage.setItem("quizHubMuted",String(soundsMuted));
    updateSoundToggle();
  });
  updateSoundToggle();

  document.addEventListener("keydown",function(event){
    if(event.key.toLowerCase()!=="m" || event.target.tagName==="INPUT") return;
    event.preventDefault();
    soundsMuted=!(soundsMuted && localStorage.getItem("quizHubMusicMuted")==="true");
    localStorage.setItem("quizHubMuted",String(soundsMuted));
    localStorage.setItem("quizHubMusicMuted",String(soundsMuted));
    updateSoundToggle();
  });

  const highlightSoundPath="sfx/highlight.wav";
  document.addEventListener("pointerover",function(event){
    const button=event.target.closest("button");
    if(!soundsMuted && button && !button.contains(event.relatedTarget)){
      const highlightSound=new Audio(highlightSoundPath);
      highlightSound.play().catch(()=>{});
    }
  });

  const params = new URLSearchParams(window.location.search);
  let data = null;

  // URLSearchParams already decodes the query parameter once.
  const raw = params.get("results");
  if(raw){
    try{ data = JSON.parse(raw); }
    catch(err){ console.error("Could not read quiz results:",err); }
  }

  // Compatibility fallback if the quiz later stores results in sessionStorage.
  if(!data){
    try{
      const saved = sessionStorage.getItem("lakeheadQuizResults");
      if(saved) data = JSON.parse(saved);
    }catch(err){}
  }

  const scoreEl = document.getElementById("score");
  const summaryEl = document.getElementById("summary");
  const reviewEl = document.getElementById("review");
  const errorEl = document.getElementById("error");
  const retryBtn = document.getElementById("retry");
  const menuBtn = document.getElementById("menu");
  const retakeIncorrectBtn = document.getElementById("retakeIncorrect");
  const filterButtons = [...document.querySelectorAll(".filter-btn")];
  const winClose = document.getElementById("winClose");

  winClose.addEventListener("click",function(){
    window.location.href = "index.html";
  });

  if(!data || !Array.isArray(data.history)){
    scoreEl.textContent = "—";
    summaryEl.textContent = "Results could not be loaded.";
    errorEl.classList.add("show");
    retryBtn.style.display = "none";
    retakeIncorrectBtn.style.display = "none";
    return;
  }

  const category =
    typeof data.category === "string" && data.category.trim()
      ? data.category
      : "Mixed STEM";

  const total = Number.isFinite(Number(data.total))
    ? Number(data.total)
    : data.history.length;

  const score = Number.isFinite(Number(data.score))
    ? Number(data.score)
    : 0;

  const correctCount = data.history.filter((item) => item && item.correct === true).length;
  const incorrectCount = data.history.filter((item) => item && item.correct !== true).length;

  scoreEl.textContent = score + " / " + total;

  // Passing = at least 50%.
  const passed = total > 0 && score / total >= 0.5;

  summaryEl.textContent = passed
    ? `You passed! ${correctCount} correct and ${incorrectCount} missed.`
    : `Keep practicing — ${incorrectCount} missed questions are ready to retry.`;

  function findQuestionIndex(item){
    if (!item || typeof item !== "object") return null;

    if (Number.isInteger(Number(item.questionIndex)) && Number(item.questionIndex) >= 0) {
      return Number(item.questionIndex);
    }

    const bank = window.questionBank && window.questionBank[category]
      ? window.questionBank[category]
      : [];

    const normalized = typeof item.question === "string"
      ? item.question.trim().toLowerCase().replace(/\s+/g, " ")
      : "";

    const foundIndex = bank.findIndex((entry) => {
      if (!entry || typeof entry.q !== "string") return false;
      return entry.q.trim().toLowerCase().replace(/\s+/g, " ") === normalized;
    });

    return foundIndex >= 0 ? foundIndex : null;
  }

  function getIncorrectQuestionIndexes(){
    const bank = window.questionBank && window.questionBank[category]
      ? window.questionBank[category]
      : [];

    const indexes = [];
    data.history.forEach((item) => {
      if (!item || item.correct === true) return;
      const questionIndex = findQuestionIndex(item);
      if (questionIndex === null || !bank[questionIndex]) return;
      if (!indexes.includes(questionIndex)) {
        indexes.push(questionIndex);
      }
    });

    return indexes;
  }

  let activeFilter = "all";

  function renderReview(){
    reviewEl.innerHTML = "";
    const items = data.history.filter((item) => {
      if (activeFilter === "correct") return item && item.correct === true;
      if (activeFilter === "incorrect") return item && item.correct !== true;
      return true;
    });

    if (!items.length){
      const empty = document.createElement("div");
      empty.className = "answer";
      empty.textContent = activeFilter === "all"
        ? "No questions were recorded for this quiz."
        : "No questions match this filter.";
      reviewEl.appendChild(empty);
      return;
    }

    items.forEach(function(item,index){
      const originalIndex = data.history.indexOf(item);
      const article = document.createElement("article");
      const correct = item && item.correct === true;
      const skipped = item && item.skipped === true;

      article.className = "item " + (correct ? "correct" : "wrong");
      article.style.animationDelay = (index * 65) + "ms";

      const q = document.createElement("div");
      q.className = "q";
      q.textContent = (originalIndex + 1) + ". " + (item.question || "Question");

      const answer = document.createElement("div");
      answer.className = "answer";

      const yourLabel = document.createElement("strong");
      yourLabel.textContent = "Your answer:";
      answer.appendChild(yourLabel);
      answer.appendChild(document.createTextNode(
        " " + (skipped ? "Skipped" : (item.selected || "No answer"))
      ));

      answer.appendChild(document.createElement("br"));

      const correctLabel = document.createElement("strong");
      correctLabel.textContent = "Correct answer:";
      answer.appendChild(correctLabel);
      answer.appendChild(document.createTextNode(
        " " + (item.correctAnswer || "—")
      ));

      const status = document.createElement("div");
      status.className = "status";
      status.textContent =
        correct ? "CORRECT" : (skipped ? "SKIPPED" : "INCORRECT");

      article.appendChild(q);
      article.appendChild(answer);
      article.appendChild(status);
      reviewEl.appendChild(article);
    });
  }

  filterButtons.forEach(function(button){
    button.addEventListener("click",function(){
      activeFilter = button.dataset.filter || "all";
      filterButtons.forEach((btn) => btn.classList.toggle("active", btn === button));
      renderReview();
    });
  });

  const incorrectQuestionIndexes = getIncorrectQuestionIndexes();
  retakeIncorrectBtn.disabled = incorrectQuestionIndexes.length === 0;
  retakeIncorrectBtn.textContent = incorrectQuestionIndexes.length > 0
    ? `RETAKE ${incorrectQuestionIndexes.length} MISSED`
    : "NO MISSED QUESTIONS";

  retakeIncorrectBtn.addEventListener("click",function(){
    if (incorrectQuestionIndexes.length === 0) return;

    const target = new URL("quiz.html", window.location.href);
    target.searchParams.set("category", category);
    target.searchParams.set("miniQuiz", "true");
    target.searchParams.set("miniQuestions", incorrectQuestionIndexes.join(","));
    window.location.href = target.toString();
  });

  renderReview();

  retryBtn.addEventListener("click",function(){
    window.location.href =
      "quiz.html?category=" + encodeURIComponent(category);
  });

  menuBtn.addEventListener("click",function(){
    window.location.href = "index.html";
  });

  /* -------------------------------------------------------
     CSS/JS FIREWORKS
     Passed: many fireworks
     Failed: exactly one firework
     ------------------------------------------------------- */
  const canvas = document.getElementById("fireworks");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, dpr = 1;
  let fireworks = [];
  let particles = [];
  let launchTimer = null;
  let animationId = null;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  window.addEventListener("resize",resize);
  resize();

  function random(min,max){
    return min + Math.random() * (max-min);
  }

  function launch(x, targetY){
    fireworks.push({
      x:x,
      y:H + 12,
      vx:random(-.7,.7),
      vy:random(-12.5,-15.5),
      targetY:targetY,
      hue:random(0,360),
      trail:[]
    });
  }

  function burst(x,y,hue){
    const count = Math.floor(random(65,105));

    for(let i=0;i<count;i++){
      const angle = (Math.PI * 2 * i / count) + random(-.035,.035);
      const speed = random(2.2,7.5);
      particles.push({
        x:x,y:y,
        vx:Math.cos(angle)*speed,
        vy:Math.sin(angle)*speed,
        gravity:.075,
        drag:.985,
        life:random(48,92),
        maxLife:0,
        hue:hue + random(-28,28),
        size:random(1.2,2.8)
      });
    }

    // Bright central flash.
    particles.push({
      x:x,y:y,vx:0,vy:0,gravity:0,drag:1,
      life:18,maxLife:18,hue:hue,size:9,flash:true
    });
  }

  function update(){
    ctx.clearRect(0,0,W,H);

    // Slightly transparent dark overlay creates glowing trails.
    ctx.fillStyle = "rgba(8,17,29,.16)";
    ctx.fillRect(0,0,W,H);

    for(let i=fireworks.length-1;i>=0;i--){
      const f = fireworks[i];

      f.trail.push({x:f.x,y:f.y});
      if(f.trail.length > 8) f.trail.shift();

      f.x += f.vx;
      f.y += f.vy;
      f.vy += .105;

      ctx.beginPath();
      for(let j=0;j<f.trail.length;j++){
        const p=f.trail[j];
        if(j===0) ctx.moveTo(p.x,p.y);
        else ctx.lineTo(p.x,p.y);
      }
      ctx.strokeStyle = "rgba(255,220,170,.65)";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(f.x,f.y,2.5,0,Math.PI*2);
      ctx.fillStyle="#fff5cf";
      ctx.fill();

      if(f.y <= f.targetY){
        burst(f.x,f.y,f.hue);
        fireworks.splice(i,1);
      }
    }

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];

      p.x += p.vx;
      p.y += p.vy;
      p.vx *= p.drag;
      p.vy = p.vy * p.drag + p.gravity;
      p.life--;

      const alpha = Math.max(0,p.life / (p.maxLife || 70));

      if(p.flash){
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size*(1-alpha+.3),0,Math.PI*2);
        ctx.fillStyle="rgba(255,244,195,"+alpha+")";
        ctx.fill();
      }else{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fillStyle="hsla("+p.hue+",95%,70%,"+alpha+")";
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(p.x,p.y);
        ctx.lineTo(p.x-p.vx*3,p.y-p.vy*3);
        ctx.strokeStyle="hsla("+p.hue+",95%,72%,"+(alpha*.45)+")";
        ctx.lineWidth=1.2;
        ctx.stroke();
      }

      if(p.life<=0) particles.splice(i,1);
    }

    animationId=requestAnimationFrame(update);
  }

  function startFireworks(){
    const reduced = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if(reduced) return;

    update();

    // Continuous celebration regardless of score.
    // Several initial launches make the page feel alive immediately,
    // then a steady stream keeps the sky filled with fireworks.
    setTimeout(()=>launch(W*.18, H*.30),250);
    setTimeout(()=>launch(W*.50, H*.22),500);
    setTimeout(()=>launch(W*.82, H*.28),750);
    setTimeout(()=>launch(W*.35, H*.38),1000);
    setTimeout(()=>launch(W*.68, H*.34),1250);

    launchTimer = setInterval(function(){
      launch(
        random(W*.08,W*.92),
        random(H*.16,H*.45)
      );
    },420);
  }

  startFireworks();

  window.addEventListener("beforeunload",function(){
    if(launchTimer) clearInterval(launchTimer);
    if(animationId) cancelAnimationFrame(animationId);
  });
});
</script>
</body>
</html>
