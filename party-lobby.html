<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuizHub Party Lobby</title>
<link rel="stylesheet" href="css/party-lobby.css">
<link rel="stylesheet" href="css/preferences.css">
<script src="js/audio-focus.js" defer></script>
<script src="js/preferences.js" defer></script>
<script src="js/mixed-study.js" defer></script>
<script src="js/party-config.js" defer></script>
<script src="js/party-client.js" defer></script>
<script src="js/party-lobby.js" defer></script>
</head>
<body>
<audio id="partyLobbyMusic" src="music/Party.mp3" loop preload="auto"></audio>
<main class="party-shell party-lobby-shell">
  <p class="party-kicker">PARTY LOBBY</p>
  <div class="party-room-heading">
    <div><h1>Room <span id="partyRoomCode">----</span></h1><p id="partyRoomStatus">Connecting to the lobby…</p></div>
    <div class="party-room-actions">
      <button type="button" class="party-secondary" id="partyOptionsButton"
        aria-haspopup="dialog" aria-controls="partyOptionsDialog" aria-expanded="false">OPTIONS</button>
      <button type="button" class="party-secondary" id="partyCopyCode">COPY CODE</button>
    </div>
  </div>
  <section class="party-options-overlay" id="partyOptionsDialog" role="dialog"
    aria-labelledby="partyOptionsTitle" aria-modal="true" hidden>
    <div class="party-options-panel">
      <h2 id="partyOptionsTitle">Party options</h2>
      <p id="partyOptionsHint">The host controls these settings for everyone.</p>
      <label class="party-option">
        <input type="checkbox" id="partyShowScores" checked>
        <span>Show other players’ scores</span>
      </label>
      <label class="party-option">
        <input type="checkbox" id="partyShowLockedAnswers" checked>
        <span>Show other players’ locked-in answers</span>
      </label>
      <label class="party-option">
        <input type="checkbox" id="partyEarlyBonus" checked>
        <span>Early point bonus: first correct answer earns 3 points</span>
      </label>
      <button type="button" class="party-primary" id="partyOptionsClose">DONE</button>
    </div>
  </section>
  <section class="party-player-list" id="partyPlayerList" aria-label="Players in this lobby"></section>
  <div class="party-lobby-controls">
    <button class="party-secondary" id="partyLeaveButton" type="button" disabled>LEAVE LOBBY</button>
    <p class="party-error" id="partyLobbyError" role="status" aria-live="polite"></p>
  </div>
  <section class="party-host-controls" id="partyHostControls" hidden>
    <p class="party-room-limit">Up to 50 players can join this room. At least two players are needed to start.</p>
    <h2>Choose the quiz</h2>
    <label for="partyQuizMode">Quiz type</label>
    <select id="partyQuizMode">
      <option value="course">Single course quiz</option>
      <option value="mixed">Mixed Study</option>
    </select>
    <div id="partyCourseQuiz">
      <label for="partyCategory">Course</label>
      <select id="partyCategory">
        <option value="CompArch">Computer Architecture</option>
        <option value="CloudComp">Cloud Computing</option>
        <option value="SocIndi">Society, Individuals and Technology</option>
        <option value="DataSci">Data Science</option>
        <option value="SoftEngi">Software Engineering</option>
      </select>
      <label for="partyQuiz">Quiz</label>
      <select id="partyQuiz"></select>
    </div>
    <fieldset class="party-mixed-study" id="partyMixedStudy" hidden>
      <legend>Question banks and review sets</legend>
      <div class="mixed-source-list" id="partyMixedSources"></div>
      <p class="party-error" id="partyMixedError" role="status" aria-live="polite"></p>
    </fieldset>
    <button class="party-primary" id="partyLaunchButton" type="button" disabled>CHOOSE QUIZ SETTINGS</button>
  </section>
</main>
</body>
</html>
