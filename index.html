<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Hub</title>
<link rel="stylesheet" href="css/title.css" >
<script src="./js/index.js" defer></script>
</head>
<body>
<button class="sound-toggle" id="soundToggle" type="button" aria-label="Mute sounds" aria-pressed="false">🔊</button>
<button class="music-toggle" id="musicToggle" type="button" aria-label="Mute music" aria-pressed="false">♫</button>
<div class="sky"><div class="cloud-track"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div><div class="cloud c5"></div><div class="cloud c6"></div><div class="cloud c7"></div><div class="cloud c8"></div><div class="cloud c9"></div></div></div>
<div class="ground"></div>

<div class="building">
  <div class="pillar left"></div><div class="pillar right"></div>
  <div class="content">
    <div class="menu-datetime" aria-label="Current date and time">
      <span class="clock-icon" aria-hidden="true"></span>
      <div class="menu-datetime-values">
        <span id="menuDate"></span>
        <span id="menuTime"></span>
      </div>
    </div>
    <header>
      <div class="title-wrap"><div class="university">
        Lakehead University - Barrie STEM Hub<span class="diamond"></span>
      </div>
        <h1 aria-label="Lakehead STEM Hub">
          <span class="stem-letter">Q</span><span class="stem-letter">U</span><span class="stem-letter">I</span><span class="stem-letter">Z</span><span class="stem-letter">&nbsp;</span><span class="stem-letter">H</span><span class="stem-letter">u</span><span class="stem-letter">b</span><span class="stem-letter">!</span></h1>
      <div class="tagline">Version 1.4</div></div></header>
    <main class="menu-area">
      <button class="menu-arrow menu-arrow-left" type="button" aria-label="Show previous page">&#8249;</button>
      <div class="menu-viewport">
        <div class="menu-track" id="menuTrack">
          <section class="menu" aria-label="Quiz courses page 1">
            <button class="card course-card" data-course="CompArch"><div class="card-content"><h2>COMP-2453</h2><p>Intro Comp Arch</p></div></button>
            <button class="card course-card coming-soon" data-coming-soon="true"><div class="card-content"><h2>COMING SOON</h2><p>Computer Graphics</p></div></button>
            <button class="card course-card coming-soon" data-coming-soon="true" data-course="SocIndi"><div class="card-content"><h2>COMING SOON</h2><p>Tech Soc Indi People Can</p></div></button>
            <!-- <button class="card course-card" data-course="SocIndi"><div class="card-content"><h2>SOCI-2755</h2><p>Tech Soc Indi People Can</p></div></button> -->
            <button class="card course-card" data-course="CloudComp"><div class="card-content"><h2>COMP-4312</h2><p>Cloud Computing</p></div></button>
            <button class="card course-card" data-course="DataSci"><div class="card-content"><h2>COMP-4112</h2><p>Intro Data Science</p></div></button>
            <button class="card course-card coming-soon" data-coming-soon="true"><div class="card-content"><h2>COMING SOON</h2><p>Suggestion? Mention in #quizhub!</p></div></button>
          </section>
          <section class="menu" aria-label="Quiz courses page 2">
            <button class="card course-card coming-soon" data-coming-soon="true"><div class="card-content"><h2>COMING SOON</h2><p>Suggestion? Mention in #quizhub!</p></div></button>
            <button class="card course-card coming-soon" data-coming-soon="true"><div class="card-content"><h2>COMING SOON</h2><p>Suggestion? Mention in #quizhub!</p></div></button>
            <button class="card course-card coming-soon" data-coming-soon="true"><div class="card-content"><h2>COMING SOON</h2><p>Suggestion? Mention in #quizhub!</p></div></button>
            <button class="card course-card coming-soon" data-coming-soon="true"><div class="card-content"><h2>COMING SOON</h2><p>Suggestion? Mention in #quizhub!</p></div></button>
            <button class="card course-card coming-soon" data-coming-soon="true"><div class="card-content"><h2>COMING SOON</h2><p>Suggestion? Mention in #quizhub!</p></div></button>
            <button class="card course-card coming-soon" data-coming-soon="true"><div class="card-content"><h2>COMING SOON</h2><p>Suggestion? Mention in #quizhub!</p></div></button>
          </section>
        </div>
      </div>
      <button class="menu-arrow menu-arrow-right" type="button" aria-label="Show next page">&#8250;</button>
    </main>
    <button class="patchnotes-button" id="patchnotesButton" type="button">PATCH NOTES</button>
  </div>
</div>

<div class="quiz-modal" id="quizModal" aria-hidden="true">
  <div class="quiz-modal-backdrop" data-close-quiz-menu></div>
  <div class="quiz-menu" role="dialog" aria-modal="true" aria-labelledby="quizMenuTitle">
    <button class="quiz-menu-close" type="button" data-close-quiz-menu aria-label="Close quiz menu">&times;</button>
    <div class="quiz-menu-kicker" id="quizMenuCourse">Quiz Picker</div>
    <h2 id="quizMenuTitle">Choose an Option</h2>
    <p>Select which quiz you would like to take.</p>
    <div class="quiz-options"></div>
  </div>
</div>

<div class="patchnotes-modal" id="patchnotesModal" aria-hidden="true">
  <div class="patchnotes-backdrop" data-close-patchnotes></div>
  <section class="patchnotes-panel" role="dialog" aria-modal="true" aria-labelledby="patchnotesTitle">
    <button class="patchnotes-close" type="button" data-close-patchnotes aria-label="Close patch notes">&times;</button>
    <div class="quiz-menu-kicker">VERSION HISTORY</div>
    <h2 id="patchnotesTitle">Patch Notes</h2>
    <pre class="patchnotes-content" id="patchnotesContent">Loading patch notes...</pre>
  </section>
</div>

<div class="transition-black"></div>
<div class="welcome"><div><div class="welcome-line" id="welcomeLine"></div><div class="loading-status" id="loadingStatus">Loading...</div></div></div>
<div class="start-cover"></div>
</body>
</html>
